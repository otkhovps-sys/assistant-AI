<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trợ lý AI</title>
<style>
  :root { --bg:#0b0d12; --fg:#e9ecf3; --dim:#8b93a5; --line:#232836; --panel:#141824; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); overflow: hidden;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; user-select: none;
  }
  #stage { flex: 1; min-height: 0; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #status {
    position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    color: var(--dim); font-size: 13px; letter-spacing: .02em; padding: 0 20px;
  }
  #status.error { color: #ff8a8a; }
  #captions { height: 112px; padding: 4px 24px 0; text-align: center; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
  #you { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ai { max-height: 66px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  #toast { height: 22px; text-align: center; font-size: 12px; color: var(--dim); opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }
  #toast.fail { color: #ff8a8a; }
  form { display: flex; gap: 8px; padding: 8px 16px 16px; }
  input {
    flex: 1; min-width: 0; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 22px; padding: 0 16px; height: 44px; font: inherit; outline: none; user-select: text;
  }
  input:focus { border-color: #4a5570; }
  input::placeholder { color: #5d6577; }
  button {
    width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); cursor: pointer; display: grid; place-items: center;
  }
  button:hover { border-color: #4a5570; }
  button:focus-visible, input:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 2px; }
  #mic[aria-pressed="true"] { background: #3a1a1e; border-color: #7a2f36; color: #ff8a8a; }
  #mic .off { display: none; }
  #mic[aria-pressed="true"] .off { display: block; }
  #pin { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; z-index: 1; color: var(--dim); }
  #pin[aria-pressed="true"] { color: #9fc0ff; border-color: #3a4a6e; }
  #pin svg { width: 16px; height: 16px; }
  #stop { display: none; color: #ff8a8a; border-color: #7a2f36; }
  body.busy #stop { display: grid; }
  body.busy #send { display: none; }
  #confirm {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 3; display: none;
    background: #1a1f2e; border: 1px solid #3a4a6e; border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
  }
  #confirm.on { display: block; }
  #confirm h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  #confirm p { margin: 0 0 10px; color: var(--dim); font-size: 13px; }
  #confirm pre {
    margin: 0 0 14px; padding: 10px 12px; max-height: 150px; overflow: auto; user-select: text;
    background: #0b0d12; border: 1px solid var(--line); border-radius: 10px;
    font: 12px/1.5 Consolas, ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
  }
  #confirm .row { display: flex; gap: 8px; }
  #confirm .row button { flex: 1; width: auto; height: 40px; border-radius: 20px; font: inherit; }
  #allow { background: #2b4a8f; border-color: #3f65bd; }
  #start {
    position: fixed; inset: 0; z-index: 2; display: none; place-items: center; cursor: pointer;
    background: rgba(11, 13, 18, .82); color: var(--fg); border: 0; border-radius: 0; width: 100%; height: 100%;
    font: inherit; font-size: 16px;
  }
  #start.on { display: grid; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<button id="start" type="button">Bấm để bắt đầu trò chuyện</button>
<div id="stage">
  <button type="button" id="pin" aria-pressed="false" aria-label="Luôn nổi trên các ứng dụng khác" title="Luôn nổi trên các ứng dụng khác">
    <svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3H7l3-3-1-6zM12 12v9"/></svg>
  </button>
  <canvas id="orb" aria-hidden="true"></canvas>
  <div id="status" role="status">Đang kết nối…</div>
</div>
<div id="captions">
  <div id="you"></div>
  <div id="ai"><div id="aiText"></div></div>
</div>
<div id="toast"></div>
<form id="form" autocomplete="off">
  <button type="button" id="mic" aria-pressed="false" aria-label="Tắt micro" title="Tắt/bật micro">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="off" d="M4 4l16 16"/></svg>
  </button>
  <input id="text" placeholder="Hoặc gõ lệnh ở đây…" aria-label="Gõ lệnh">
  <button type="button" id="stop" aria-label="Dừng" title="Dừng việc đang làm">
    <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
  </button>
  <button type="submit" id="send" aria-label="Gửi" title="Gửi">
    <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</form>
<div id="confirm" role="alertdialog" aria-labelledby="cTitle">
  <h2 id="cTitle">Trợ lý muốn chạy một lệnh</h2>
  <p id="cReason"></p>
  <pre id="cDetail"></pre>
  <div class="row">
    <button type="button" id="deny">Từ chối</button>
    <button type="button" id="allow">Cho phép</button>
  </div>
</div>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
const st = { conn: 'connecting', msg: '', muted: false, speaking: false, mic: 0, out: 0, live: false, hint: '', busy: false };
function setBusy(on) { st.busy = on; document.body.classList.toggle('busy', on); }
let confirmId = 0;

function post(path, body) {
  return fetch(path + '?t=' + token, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}

// ---- Sự kiện từ app ----
let lastWho = '', toastTimer;
function onEvent(e) {
  switch (e.type) {
    case 'level': if (!speech) { st.mic = e.mic; st.out = e.out; st.speaking = e.speaking; } break; // chế độ trình duyệt tự đo
    case 'status': st.conn = e.state; st.msg = e.message || ''; if (speech) speech.sync(); break;
    case 'muted': st.muted = e.muted; if (speech) speech.sync(); $('mic').setAttribute('aria-pressed', e.muted);
      $('mic').setAttribute('aria-label', e.muted ? 'Bật micro' : 'Tắt micro'); break;
    case 'text': {
      const el = e.who === 'user' ? $('you') : $('aiText');
      if (lastWho !== e.who) { el.textContent = ''; if (e.who === 'user') $('aiText').textContent = ''; }
      lastWho = e.who;
      el.textContent += e.text;
      if (e.who === 'user') setBusy(true);
      break;
    }
    case 'say': if (speech && lastWho === 'ai') speech.say($('aiText').textContent); lastWho = ''; break;
    case 'turn': if (speech && lastWho === 'ai') speech.say($('aiText').textContent); lastWho = ''; setBusy(false); break;
    case 'pin': $('pin').setAttribute('aria-pressed', e.on); break;
    case 'confirm':
      confirmId = e.id; $('cReason').textContent = e.title; $('cDetail').textContent = e.detail;
      $('confirm').className = 'on'; $('deny').focus();
      break;
    case 'confirm_done': if (e.id === confirmId) $('confirm').className = ''; break;
    case 'config': if (e.speech === 'browser' && !speech) speech = browserSpeech(); break;
    case 'error':
      $('toast').textContent = e.message; $('toast').className = 'on fail';
      clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').className = '', 8000);
      break;
    case 'tool':
      $('toast').textContent = (e.ok ? 'Đã chạy: ' : 'Lỗi khi chạy: ') + e.name;
      $('toast').className = 'on' + (e.ok ? '' : ' fail');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').className = '', 3500);
      break;
  }
}
function connect() {
  const es = new EventSource('/events?t=' + token);
  es.onopen = () => { st.live = true; };
  es.onmessage = m => onEvent(JSON.parse(m.data));
  es.onerror = () => { st.live = false; };
}
connect();

// ---- Giọng nói bằng trình duyệt ----
// Dùng khi máy chủ AI chỉ trao đổi bằng chữ: trình duyệt nhận giọng nói thành chữ và đọc câu trả lời.
let speech = null;
function browserSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  let rec = null, running = false, started = false, talking = false;

  // Chỉ nghe khi đã bắt đầu, micro bật và trợ lý không đang đọc (để nó không nghe lại chính mình).
  const wantListen = () => started && !st.muted && !talking && st.conn === 'ready';
  function sync() {
    if (!rec) return;
    if (wantListen() && !running) { try { rec.start(); running = true; } catch (_) {} }
    if (!wantListen() && running) rec.abort();
  }
  if (SR) {
    rec = new SR();
    rec.lang = 'vi-VN'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i], text = r[0].transcript.trim();
        if (!r.isFinal) interim += text + ' ';
        else if (text) post('/send', { text });
      }
      if (interim) { $('you').textContent = interim; lastWho = ''; }
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        started = false; st.hint = 'Chưa được cấp quyền micro. Bạn vẫn gõ lệnh được.';
      } else if (ev.error === 'network') st.hint = 'Không kết nối được dịch vụ nhận giọng nói.';
    };
    rec.onend = () => { running = false; setTimeout(sync, 300); };
  } else {
    st.hint = 'Trình duyệt này không nhận được giọng nói. Hãy gõ lệnh.';
  }

  // Mức micro cho hình cầu.
  async function meter() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ac = new AudioContext(), an = ac.createAnalyser(), buf = new Float32Array(1024);
      an.fftSize = 1024; ac.createMediaStreamSource(stream).connect(an);
      setInterval(() => {
        an.getFloatTimeDomainData(buf);
        let sum = 0; for (const v of buf) sum += v * v;
        st.mic = Math.sqrt(sum / buf.length);
      }, 50);
    } catch (_) {}
  }

  function say(text) {
    text = text.trim();
    if (!synth || !text) return;
    const u = new SpeechSynthesisUtterance(text);
    const vi = /[ăâđêôơưàáạảãèéẹẻẽìíịỉĩòóọỏõùúụủũỳýỵỷỹ]/i.test(text);
    const voices = synth.getVoices().filter(v => v.lang.toLowerCase().startsWith(vi ? 'vi' : 'en'));
    const voice = voices.find(v => /natural|online/i.test(v.name)) || voices[0];
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = vi ? 'vi-VN' : 'en-US';
    // Nhiều đoạn lời xếp hàng đọc lần lượt; chỉ coi là hết nói khi hàng đợi trống.
    const done = () => { if (synth.speaking || synth.pending) return; talking = false; st.speaking = false; sync(); };
    u.onstart = () => { talking = true; st.speaking = true; sync(); };
    u.onend = done; u.onerror = done;
    synth.speak(u);
  }
  function hush() { if (synth) synth.cancel(); talking = false; st.speaking = false; sync(); }
  // Trình duyệt không cho biết âm lượng giọng đọc, nên hình cầu gợn theo nhịp giả khi đang đọc.
  setInterval(() => { if (talking) st.out = 0.05 + 0.05 * Math.abs(Math.sin(performance.now() / 110)) + 0.03 * Math.random(); }, 50);

  // Trình duyệt chỉ cho đọc thành tiếng sau khi người dùng bấm vào trang một lần.
  $('start').className = 'on';
  $('start').onclick = () => { $('start').className = ''; started = true; if (synth) synth.getVoices(); meter(); sync(); };
  return { say, sync, hush };
}

// ---- Điều khiển ----
$('mic').onclick = () => post('/mute', { muted: !st.muted });
$('pin').onclick = () => post('/pin', { on: $('pin').getAttribute('aria-pressed') !== 'true' });
$('stop').onclick = () => { post('/stop', {}); if (speech) speech.hush(); };
$('allow').onclick = () => post('/confirm', { id: confirmId, ok: true });
$('deny').onclick = () => post('/confirm', { id: confirmId, ok: false });
$('form').onsubmit = ev => {
  ev.preventDefault();
  const v = $('text').value.trim();
  if (v) { post('/send', { text: v }); $('text').value = ''; }
};

// ---- Hình cầu ----
const cv = $('orb'), cx = cv.getContext('2d');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MODES = {
  speaking:   { a: [143, 240, 255], b: [91, 108, 255],  label: 'Đang nói' },
  listening:  { a: [246, 248, 252], b: [150, 164, 190], label: 'Đang nghe' },
  thinking:   { a: [214, 190, 255], b: [124, 92, 220],  label: 'Đang xử lý…' },
  muted:      { a: [86, 93, 110],   b: [46, 51, 64],    label: 'Đã tắt micro' },
  connecting: { a: [120, 128, 148], b: [56, 62, 78],    label: 'Đang kết nối…' },
  error:      { a: [255, 138, 138], b: [120, 44, 52],   label: 'Có lỗi' },
  closed:     { a: [86, 93, 110],   b: [46, 51, 64],    label: 'App đã thoát. Bạn có thể đóng cửa sổ này.' },
};
function mode() {
  if (!st.live) return 'closed';
  if (st.conn === 'error') return 'error';
  if (st.conn !== 'ready') return 'connecting';
  if (st.speaking) return 'speaking';
  if (st.busy) return 'thinking';
  return st.muted ? 'muted' : 'listening';
}
let lvl = 0, col = { a: [...MODES.connecting.a], b: [...MODES.connecting.b] }, shown = '';
const mix = (from, to, k) => from.forEach((v, i) => from[i] = v + (to[i] - v) * k);
const rgb = (c, al = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`;

function draw(ms) {
  const t = ms / 1000, dpr = devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, w, h);

  const m = mode(), M = MODES[m];
  const label = (m === 'error' || m === 'connecting') && st.msg ? st.msg : m === 'listening' && st.hint ? st.hint : M.label;
  if (label !== shown) { shown = label; $('status').textContent = label; $('status').className = m === 'error' ? 'error' : ''; }

  // Tiếng nói thường có RMS nhỏ, nên kéo giãn để hình cầu phản ứng rõ.
  const raw = m === 'speaking' ? st.out : m === 'listening' ? st.mic : 0;
  const target = Math.min(1, Math.sqrt(raw) * 1.9);
  lvl += (target - lvl) * (target > lvl ? 0.35 : 0.12);
  mix(col.a, M.a, 0.08); mix(col.b, M.b, 0.08);

  const R = Math.min(w, h) * 0.24, ox = w / 2, oy = h / 2 - 6;
  const breathe = calm ? 0 : m === 'thinking' ? Math.sin(t * 3.2) * 0.05 : Math.sin(t * (m === 'connecting' ? 2.4 : 1.1)) * 0.025;
  const radius = R * (1 + breathe + lvl * (m === 'speaking' ? 0.22 : 0.14));
  const wob = calm ? 0 : m === 'speaking' ? 0.03 + lvl * 0.16 : m === 'listening' ? 0.012 + lvl * 0.07 : m === 'thinking' ? 0.05 : 0.01;

  // Quầng sáng
  const glow = cx.createRadialGradient(ox, oy, radius * 0.6, ox, oy, radius * 2.1);
  glow.addColorStop(0, rgb(col.b, 0.28 + lvl * 0.25)); glow.addColorStop(1, rgb(col.b, 0));
  cx.fillStyle = glow; cx.fillRect(0, 0, w, h);

  // Thân hình cầu, viền gợn theo âm lượng
  cx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const a = i / 120 * Math.PI * 2;
    const r = radius * (1 + wob * (Math.sin(3 * a + t * 1.7) * 0.5 + Math.sin(5 * a - t * 2.3) * 0.3 + Math.sin(2 * a + t * 0.9) * 0.2));
    const x = ox + Math.cos(a) * r, y = oy + Math.sin(a) * r;
    i ? cx.lineTo(x, y) : cx.moveTo(x, y);
  }
  cx.closePath();
  const g = cx.createRadialGradient(ox - radius * 0.35, oy - radius * 0.4, radius * 0.1, ox, oy, radius * 1.15);
  g.addColorStop(0, rgb(col.a)); g.addColorStop(1, rgb(col.b));
  cx.fillStyle = g; cx.fill();

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
